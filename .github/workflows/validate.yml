name: Validate multilingual analyzer
on:
  pull_request:
  push:
    branches: [codex/worldwide-multilingual]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.cjs
      - run: npm run build
      - run: npm run build
        env:
          ELEVENTY_PATH_PREFIX: /birdnet-live-analyzer/
      - uses: actions/upload-artifact@v4
        with:
          name: multilingual-preview
          path: _site/
